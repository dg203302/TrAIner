<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#06080c">
    <title data-i18n-en="Verifying user · TrAIner">Verificando usuario · TrAIner</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- PWA y Scripts de Sistema -->
    <link rel="icon" type="image/png" href="/Icons/2.png">
    <link rel="apple-touch-icon" href="/Icons/apple-icon-180.png">
    <link rel="manifest" href="/manifest.json">
    <script src="/Scripts/ui_transparencia_apply.js"></script>
    <script src="/Scripts/ui_idioma.js"></script>
    <script src="/Scripts/spa_router.js"></script>
    <script>
        // Detección temprana e inmediata de pantalla (Desktop vs Móvil)
        (function () {
            try {
                const isDesktop = (window.matchMedia && window.matchMedia("(min-width: 1024px)").matches) || window.innerWidth >= 1024;
                localStorage.setItem("trainer_screen_mode", isDesktop ? "desktop" : "mobile");
            } catch (e) { }
        })();
    </script>

    <!-- Estilos de Verificación Renovados -->
    <link rel="stylesheet" href="/Styles/styles_verifi_usu_n.css">

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7232324434042202"
        crossorigin="anonymous"></script>
</head>

<body>
    <!-- Contenedor Principal de Verificación -->
    <main class="auth-verification-wrapper">
        <section class="verification-card" id="pt-global-loader" aria-live="polite">
            <!-- Isotipo de la Marca (animado) -->
            <div class="brand-icon-wrap">
                <img src="/Icons/2.png" alt="TrAIner Logo" class="brand-logo">
            </div>

            <!-- Textos Dinámicos de Estado -->
            <h1 class="status-title" id="status-title" data-i18n-en="Verifying session...">
                Verificando sesión...
            </h1>
            <p class="status-desc" id="status-desc" data-i18n-en="Syncing your fitness space...">
                Sincronizando tu espacio fitness...
            </p>

            <span class="sr-only" data-i18n-en="Loading, please wait...">Cargando, por favor espere...</span>

            <!-- Acciones de Contingencia en caso de conexión lenta o error -->
            <div class="fallback-action-wrap" id="fallback-action-wrap">
                <a href="/indice_renovado.html" class="btn-fallback-primary" data-i18n-en="Go to Home">
                    Ir al Inicio
                </a>
                <button type="button" class="btn-fallback-secondary" onclick="window.location.reload();"
                    data-i18n-en="Retry connection">
                    Reintentar conexión
                </button>
            </div>
        </section>
    </main>

    <!-- Pie de Página -->
    <footer class="auth-footer">
        <a href="privacy.html" class="footer-link" data-i18n-en="Privacy Policy">Política de Privacidad</a>
        <span class="footer-sep">·</span>
        <span class="footer-copy">2026 &copy; TrAIner</span>
    </footer>

    <!-- Lógica de Verificación y Redirección -->
    <script src="/Scripts/verifi_usu_n.js" type="module"></script>
</body>

</html>
