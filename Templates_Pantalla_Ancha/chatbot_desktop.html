<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat · TrAIner</title>

    <!-- Fuentes y Recursos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="/Icons/2.png">

    <!-- Scripts auxiliares -->
    <script src="/Scripts/ui_idioma.js"></script>
    <script src="/Scripts/spa_router.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/Scripts/ui_bottom_sheet.js?v=5"></script>

    <style>
        :root {
            --bg-black: #0c0d10;
            --bg-card: #181a1f;
            --bg-card-elevated: #20232a;
            --bg-card-subtle: #14161a;
            --text-primary: #ffffff;
            --text-secondary: #8a909a;
            --text-muted: #585d68;
            --dot-active: #ffffff;
            --dot-inactive: #282b33;
            --accent-glow: rgba(255, 255, 255, 0.08);
            --border-card: rgba(255, 255, 255, 0.06);
            --radius-card: 26px;
            --radius-inner: 18px;
            --radius-pill: 999px;
            --nav-height: 64px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        html {
            height: 100%;
            height: 100dvh;
            width: 100%;
            max-width: 100%;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: row;
            width: 100%;
            max-width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow-x: clip;
            margin: 0;
            padding: 0;
        }

        /* ── SIDEBAR DESKTOP FLOTANTE ── */
        .desktop-sidebar {
            width: 260px;
            min-width: 260px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 120;
            background: rgba(14, 16, 21, 0.92);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-right: 1px solid rgba(255, 255, 255, 0.07);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 18px;
            box-sizing: border-box;
        }

        .desktop-sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .desktop-sidebar-logo {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            object-fit: contain;
            box-shadow: 0 4px 16px rgba(157, 243, 255, 0.16);
        }

        .desktop-sidebar-title {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: #ffffff;
            line-height: 1.1;
        }

        .desktop-sidebar-sub {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .desktop-sidebar-tag {
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: 0.5px;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(157, 243, 255, 0.12);
            color: #9df3ff;
            margin-left: auto;
        }

        .desktop-nav-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 20px;
            flex: 1;
        }

        .desktop-nav-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: 14px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid transparent;
        }

        .desktop-nav-link svg {
            width: 20px;
            height: 20px;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .desktop-nav-link:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            transform: translateX(3px);
        }

        .desktop-nav-link.is-active {
            background: rgba(255, 255, 255, 0.09);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        .desktop-sidebar-footer {
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .desktop-user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 10px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
        }

        .desktop-user-profile:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .desktop-user-avatar-wrap {
            position: relative;
        }

        .desktop-user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
        }

        .desktop-user-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2ed573;
            border: 2px solid #0c0d10;
        }

        .desktop-user-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .desktop-user-name {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .desktop-user-sub {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* ── ÁREA PRINCIPAL DESKTOP (WIDESCREEN) ── */
        .desktop-main-wrap {
            margin-left: 260px;
            width: calc(100% - 260px);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        .app-container {
            width: 100%;
            max-width: 960px;
            height: 100%;
            padding: 20px 36px 0 36px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-sizing: border-box;
            flex: 1;
            overflow: hidden;
        }

        /* ── HEADER FLOTANTE / STICKY ── */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: -20px -36px 0 -36px;
            padding: 16px 36px;
            background: rgba(12, 13, 16, 0.85);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            transition: all 0.25s ease;
            flex-shrink: 0;
        }

        .header-title-wrap {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.8px;
            color: #fff;
            line-height: 1.1;
        }

        .header-user-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .header-user-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #2ed573;
            box-shadow: 0 0 10px rgba(46, 213, 115, 0.6);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .header-btn:hover {
            background: var(--bg-card-elevated);
            transform: scale(1.04);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .header-btn:active {
            transform: scale(0.95);
        }

        .header-btn.danger-btn:hover {
            color: #ff5252;
            background: rgba(255, 82, 82, 0.14);
            border-color: rgba(255, 82, 82, 0.3);
        }

        .header-avatar-btn {
            padding: 2px;
            overflow: hidden;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .header-avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #252830;
        }

        /* ── CONTENIDO PRINCIPAL: CHAT INTEGRADO EN LA PLANTILLA ── */
        .page-content {
            flex: 1 1 0%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-messages {
            flex: 1 1 0%;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 16px 0 calc(64px + 36px + 64px + env(safe-area-inset-bottom, 12px)) 0;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 999px;
        }

        .chat-msg {
            display: flex;
            max-width: 88%;
            animation: fadeInMsg 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeInMsg {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-msg-user {
            align-self: flex-end;
        }

        .chat-msg-bot {
            align-self: flex-start;
        }

        .chat-bubble {
            padding: 13px 18px;
            border-radius: 22px;
            font-size: 14.5px;
            line-height: 1.5;
            word-break: break-word;
        }

        /* Mensaje del Usuario: Blanco puro con texto oscuro */
        .chat-msg-user .chat-bubble {
            background: #ffffff;
            color: #0c0d10;
            font-weight: 600;
            border-bottom-right-radius: 5px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
        }

        /* Mensaje del Bot: Tarjeta oscura de la app con borde suave */
        .chat-msg-bot .chat-bubble {
            background: var(--bg-card);
            color: #f1f3f7;
            border: 1px solid var(--border-card);
            border-bottom-left-radius: 5px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
        }

        .chat-bubble ul {
            margin: 8px 0;
            padding-left: 20px;
        }

        .chat-bubble li {
            margin: 4px 0;
        }

        .chat-bubble strong {
            color: #fff;
            font-weight: 700;
        }

        .chat-msg-user .chat-bubble strong {
            color: #0c0d10;
        }

        /* Indicador de tipeo */
        .chat-typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 2px;
        }

        .chat-typing-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.55);
            animation: typingPulse 1.2s infinite ease-in-out;
        }

        .chat-typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .chat-typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingPulse {

            0%,
            80%,
            100% {
                transform: scale(0.7);
                opacity: 0.35;
            }

            40% {
                transform: scale(1.15);
                opacity: 1;
            }
        }

        .btn-chat-resend {
            background: rgba(255, 82, 82, 0.15);
            border: 1px solid rgba(255, 82, 82, 0.3);
            color: #ff6b6b;
            border-radius: 999px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: inherit;
        }

        .btn-chat-resend:hover {
            opacity: 0.85;
        }

        /* ── BARRA FLOTANTE DE ENTRADA (WIDESCREEN DESKTOP DOCK) ── */
        .chat-input-wrapper {
            position: fixed;
            bottom: 24px;
            left: calc(260px + (100% - 260px) / 2);
            transform: translateX(-50%);
            width: calc(100% - 320px);
            max-width: 860px;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 990;
        }

        .chat-input-inner {
            pointer-events: auto;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px 8px 22px;
            background: rgba(22, 25, 31, 0.94);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius-pill);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .chat-input-inner:focus-within {
            border-color: rgba(157, 243, 255, 0.35);
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.8), 0 0 20px rgba(157, 243, 255, 0.08);
        }

        .chat-input-inner textarea {
            flex: 1;
            background: transparent !important;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            resize: none;
            max-height: 120px;
            min-height: 26px;
            line-height: 1.45;
            padding: 8px 0;
        }

        .chat-input-inner textarea::placeholder {
            color: #6b7280;
        }

        .chat-input-inner button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            color: #0c0d10;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        .chat-input-inner button:hover {
            background: #e2e4e9;
            transform: scale(1.04);
        }

        .chat-input-inner button:active {
            transform: scale(0.92);
        }

        .chat-input-inner button svg {
            width: 19px;
            height: 19px;
            stroke-width: 2.3;
            stroke: #0c0d10;
        }

        /* ── BARRA INFERIOR DE NAVEGACIÓN (OCULTA EN DESKTOP) ── */
        .bottom-nav {
            display: none !important;
        }

        /* ── PUBLICIDAD / SPONSOR DARK GLASSMORPHIC ── */
        .pt-ad-container {
            width: 100%;
            margin: 4px 0 2px 0;
            display: flex;
            justify-content: center;
            flex-shrink: 0;
        }

        .pt-ad-card {
            width: 100%;
            background: rgba(24, 26, 31, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-card, 26px);
            padding: 8px 12px 4px 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow: hidden;
            position: relative;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .pt-ad-card:hover {
            border-color: rgba(255, 255, 255, 0.14);
            background: rgba(28, 31, 38, 0.85);
        }

        .pt-ad-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .pt-ad-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10.5px;
            font-weight: 700;
            color: var(--text-muted, #585d68);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .pt-ad-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: var(--text-muted, #585d68);
            opacity: 0.7;
        }

        .pt-ad-provider {
            font-size: 10px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .pt-ad-slot-wrapper {
            width: 100%;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: var(--radius-inner, 18px);
        }

        .pt-ad-slot-wrapper iframe,
        .pt-ad-slot-wrapper img {
            max-width: 100% !important;
            height: auto !important;
            display: block;
            margin: 0 auto;
        }

        /* ── PANTALLA DE CARGA GLOBAL (DARK GLASSMORPHIC) ── */
        .app-preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0c0d10;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            visibility: visible;
            pointer-events: all;
        }

        .app-preloader.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .preloader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .preloader-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .preloader-logo-ring {
            position: relative;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preloader-spinner-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: preloaderSpin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .preloader-circle-bg {
            stroke: rgba(255, 255, 255, 0.08);
        }

        .preloader-circle-spin {
            stroke: #ffffff;
            stroke-linecap: round;
            stroke-dasharray: 75, 200;
            stroke-dashoffset: 0;
            animation: preloaderDash 1.2s ease-in-out infinite;
        }

        .preloader-text-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .preloader-app-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: #ffffff;
        }

        .preloader-subtext {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 0.2px;
        }

        @keyframes preloaderSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes preloaderDash {
            0% { stroke-dasharray: 10, 200; stroke-dashoffset: 0; }
            50% { stroke-dasharray: 70, 200; stroke-dashoffset: -35; }
            100% { stroke-dasharray: 70, 200; stroke-dashoffset: -125; }
        }

        /* ── RESPONSIVIDAD PARA PANTALLAS MÓVILES COMPACTAS ── */
        @media (max-width: 480px) {
            .app-container {
                padding: 14px 14px 0 14px;
            }

            .app-header {
                margin: -14px -14px 0 -14px;
                padding: calc(12px + env(safe-area-inset-top, 6px)) 14px 12px 14px;
            }

            .header-title {
                font-size: 28px;
            }

            .chat-bubble {
                padding: 11px 15px;
                font-size: 13.5px;
            }

            .chat-input-wrapper {
                width: calc(100% - 24px);
                bottom: calc(64px + 24px + env(safe-area-inset-bottom, 12px));
            }

            .chat-messages {
                padding: 14px 0 calc(64px + 28px + 64px + env(safe-area-inset-bottom, 12px)) 0;
            }
        }
    </style>
</head>

<body>
    <!-- ── PANTALLA DE CARGA (PRELOADER DARK GLASS) ── -->
    <div id="app-preloader" class="app-preloader" aria-label="Cargando contenido">
        <div class="preloader-content">
            <div class="preloader-brand">
                <div class="preloader-logo-ring">
                    <svg class="preloader-spinner-svg" viewBox="0 0 50 50">
                        <circle class="preloader-circle-bg" cx="25" cy="25" r="20" fill="none" stroke-width="3.5"></circle>
                        <circle class="preloader-circle-spin" cx="25" cy="25" r="20" fill="none" stroke-width="3.5"></circle>
                    </svg>
                </div>
                <div class="preloader-text-wrap">
                    <span class="preloader-app-name">TrAIner</span>
                    <span class="preloader-subtext">Conectando con tu Asistente IA...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ── SIDEBAR DESKTOP FLOTANTE ── -->
    <aside class="desktop-sidebar">
        <!-- Logo & Marca -->
        <div>
            <div class="desktop-sidebar-brand">
                <img src="/Icons/2.png" alt="TrAIner Logo" class="desktop-sidebar-logo">
                <div>
                    <div class="desktop-sidebar-title">TrAIner</div>
                    <div class="desktop-sidebar-sub">Fitness & Nutrition AI</div>
                </div>
                <span class="desktop-sidebar-tag">PRO</span>
            </div>

    <!-- ── LÓGICA DE CONEXIÓN CON SUPABASE Y CHATBOT ── -->
    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.94.1/+esm";

        // Conexión idéntica a Supabase
        const supabaseUrl = "https://lhecmoeilmhzgxpcetto.supabase.co";
        const supabaseKey = "sb_publishable_oLC8LcDLa3jR72Hpd_jJsA_eXjMlP3-";
        const supabase = createClient(supabaseUrl, supabaseKey, {
            auth: { persistSession: true, autoRefreshToken: false, storage: localStorage }
        });

        let currentUser = null;

        // Recuperar usuario y datos necesarios
        async function fetchUserData() {
            try {
                const { data: authData, error: authErr } = await supabase.auth.getUser();
                if (authErr || !authData?.user) {
                    const localId = localStorage.getItem("id_usuario");
                    if (localId) {
                        currentUser = { id: localId };
                    }
                } else {
                    currentUser = authData.user;
                    localStorage.setItem("id_usuario", currentUser.id);
                    if (currentUser.user_metadata?.full_name) {
                        localStorage.setItem("username_usuario", currentUser.user_metadata.full_name);
                    }
                    const metaAvatar = currentUser.user_metadata?.avatar_url || currentUser.user_metadata?.picture;
                    if (metaAvatar) {
                        localStorage.setItem("avatar_usuario", metaAvatar);
                    }
                }

                // Renderizar perfil en cabecera
                const avatarUrl = localStorage.getItem("avatar_usuario") ||
                    currentUser?.user_metadata?.avatar_url ||
                    currentUser?.user_metadata?.picture ||
                    "https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y";
                const avatarImg = document.getElementById("header-user-avatar");
                if (avatarImg) {
                    avatarImg.src = avatarUrl;
                    avatarImg.onerror = () => {
                        avatarImg.src = "https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y";
                    };
                }

                // Asegurar que existan datos de fitness y planes en localStorage
                if (currentUser?.id) {
                    const { data: fitnessData } = await supabase
                        .from("Datos Fitness")
                        .select("id, Altura, Peso, Peso_Obj, Edad")
                        .eq("ID_user", currentUser.id)
                        .maybeSingle();

                    if (fitnessData) {
                        if (fitnessData.Peso != null) localStorage.setItem("peso_usuario", fitnessData.Peso);
                        if (fitnessData.Peso_Obj != null) localStorage.setItem("peso_objetivo_usuario", fitnessData.Peso_Obj);
                        if (fitnessData.Altura != null) localStorage.setItem("altura_usuario", fitnessData.Altura);
                        if (fitnessData.Edad != null) localStorage.setItem("edad_usuario", fitnessData.Edad);
                    }

                    const { data: planesData } = await supabase
                        .from("Planes")
                        .select("id, Plan_entreno, Plan_alimenta")
                        .eq("ID_user", currentUser.id)
                        .maybeSingle();

                    if (planesData) {
                        if (planesData.Plan_entreno) localStorage.setItem("plan_entreno_usuario", planesData.Plan_entreno);
                        if (planesData.Plan_alimenta) localStorage.setItem("plan_dieta_usuario", planesData.Plan_alimenta);
                    }
                }
            } catch (err) {
                console.error("Error al obtener datos del usuario:", err);
            }
        }

        // Formateador de Markdown
        const escapeHtml = (text) => {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text ?? '').replace(/[&<>"']/g, (m) => map[m]);
        };

        const formatChatbotMsg = (text) => {
            let html = escapeHtml(text);
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            html = html.replace(/^[\-\*]\s+(.*)$/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>(?:\n<li>.*<\/li>)*)/g, '<ul style="margin: 8px 0; padding-left: 20px;">$1</ul>');
            html = html.replace(/\n/g, '<br>');
            html = html.replace(/<br><ul/g, '<ul');
            html = html.replace(/<\/ul><br>/g, '</ul>');
            html = html.replace(/<\/li><br>/g, '</li>');
            return html;
        };

        // Inicialización del Chatbot
        function setupChatbot() {
            const messagesContainer = document.getElementById("chatbot-messages");
            const textarea = document.getElementById("chatbot-input");
            const sendBtn = document.getElementById("chatbot-send");
            const clearBtn = document.getElementById("chatbot-btn-clear");

            const username = localStorage.getItem("username_usuario") || currentUser?.user_metadata?.full_name || currentUser?.email?.split("@")[0] || "Atleta";
            const welcomeMsg = `¡Hola ${username}! Soy tu asistente inteligente TrAIner.\n¿En qué te puedo ayudar hoy con tu entrenamiento o nutrición?`;

            // Cargar historial previo guardado
            let savedHistory = [];
            try {
                savedHistory = JSON.parse(localStorage.getItem("pt_chatbot_history")) || [];
            } catch (e) {
                savedHistory = [];
            }

            // Renderizar historial o mensaje inicial
            messagesContainer.innerHTML = "";
            if (savedHistory.length === 0) {
                const welcomeEl = document.createElement("div");
                welcomeEl.className = "chat-msg chat-msg-bot";
                welcomeEl.innerHTML = `<div class="chat-bubble">${formatChatbotMsg(welcomeMsg)}</div>`;
                messagesContainer.appendChild(welcomeEl);
            } else {
                savedHistory.forEach((msg) => {
                    const msgEl = document.createElement("div");
                    msgEl.className = msg.role === "user" ? "chat-msg chat-msg-user" : "chat-msg chat-msg-bot";
                    msgEl.innerHTML = `<div class="chat-bubble">${formatChatbotMsg(msg.content)}</div>`;
                    messagesContainer.appendChild(msgEl);
                });
            }

            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 120);

            // Redimensionamiento dinámico del textarea
            const autoResize = () => {
                textarea.style.height = "auto";
                textarea.style.height = Math.min(textarea.scrollHeight, 110) + "px";
            };
            textarea.addEventListener("input", autoResize);
            textarea.addEventListener("focus", () => {
                setTimeout(() => {
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }, 300);
            });

            // Botón de limpiar historial
            if (clearBtn) {
                clearBtn.addEventListener("click", async () => {
                    let confirmed = false;
                    if (window.Swal) {
                        const res = await window.Swal.fire({
                            title: "¿Borrar historial?",
                            text: "Se eliminarán los mensajes previos de la conversación.",
                            icon: "warning",
                            showCancelButton: true,
                            confirmButtonColor: "#ff4757",
                            cancelButtonColor: "#272a33",
                            confirmButtonText: "Sí, borrar",
                            cancelButtonText: "Cancelar",
                            background: "#181a1f",
                            color: "#ffffff"
                        });
                        confirmed = res.isConfirmed;
                    } else {
                        confirmed = window.confirm("¿Deseas eliminar todo el historial con el entrenador IA?");
                    }

                    if (confirmed) {
                        localStorage.removeItem("pt_chatbot_history");
                        savedHistory = [];
                        messagesContainer.innerHTML = `
                            <div class="chat-msg chat-msg-bot">
                                <div class="chat-bubble">
                                    ${formatChatbotMsg(`¡Historial borrado!\n¿Qué te gustaría consultar ahora, ${username}?`)}
                                </div>
                            </div>
                        `;
                    }
                });
            }

            // Función de envío de mensajes
            const sendMessage = async () => {
                const text = textarea.value.trim();
                if (!text) return;

                // Mensaje del usuario
                const userMsgEl = document.createElement("div");
                userMsgEl.className = "chat-msg chat-msg-user";
                userMsgEl.innerHTML = `<div class="chat-bubble">${formatChatbotMsg(text)}</div>`;
                messagesContainer.appendChild(userMsgEl);

                textarea.value = "";
                autoResize();
                textarea.disabled = true;
                sendBtn.disabled = true;
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

                // Indicador de tipeo
                const loadingEl = document.createElement("div");
                loadingEl.className = "chat-msg chat-msg-bot";
                loadingEl.innerHTML = `
                    <div class="chat-bubble">
                        <div class="chat-typing-dots">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                `;
                messagesContainer.appendChild(loadingEl);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

                try {
                    const payload = {
                        idioma: window.UIIdioma?.getIdioma?.() || "es",
                        P_ent: localStorage.getItem("plan_entreno_usuario") || "Ninguno",
                        P_alim: localStorage.getItem("plan_dieta_usuario") || localStorage.getItem("plan_alim_usuario") || "Ninguno",
                        D_user: {
                            edad: localStorage.getItem("edad_usuario") || "",
                            altura: localStorage.getItem("altura_usuario") || "",
                            peso: localStorage.getItem("peso_usuario") || "",
                            peso_objetivo: localStorage.getItem("peso_objetivo_usuario") || ""
                        },
                        consulta: text,
                        historial: savedHistory
                    };

                    const res = await fetch("/IA_chatbot", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) throw new Error("Error en la respuesta del servidor");
                    const data = await res.json();
                    if (data.error) throw new Error(data.error);

                    loadingEl.innerHTML = `<div class="chat-bubble">${formatChatbotMsg(data.respuesta)}</div>`;

                    savedHistory.push({ role: "user", content: text });
                    savedHistory.push({ role: "assistant", content: data.respuesta });

                    try {
                        localStorage.setItem("pt_chatbot_history", JSON.stringify(savedHistory));
                    } catch (e) { }
                } catch (err) {
                    console.error("Error chatbot:", err);
                    loadingEl.innerHTML = `
                        <div class="chat-bubble" style="color: #ff6b6b; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                            <span>Error al conectar con la IA.</span>
                            <button type="button" class="btn-chat-resend">Reintentar</button>
                        </div>
                    `;
                    const retryBtn = loadingEl.querySelector(".btn-chat-resend");
                    if (retryBtn) {
                        retryBtn.addEventListener("click", () => {
                            loadingEl.remove();
                            userMsgEl.remove();
                            textarea.value = text;
                            sendMessage();
                        });
                    }
                } finally {
                    textarea.disabled = false;
                    sendBtn.disabled = false;
                    textarea.focus();
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            };

            sendBtn.addEventListener("click", sendMessage);
            textarea.addEventListener("keydown", (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        }

        // Inicializar al cargar el DOM
        window.addEventListener("DOMContentLoaded", async () => {
            const cachedAvatar = localStorage.getItem("avatar_usuario");
            if (cachedAvatar) {
                const avatarEl = document.getElementById("header-user-avatar");
                if (avatarEl) avatarEl.src = cachedAvatar;
            }

            await fetchUserData();
            setupChatbot();

            try {
                if (window.UIIdioma?.translatePage) {
                    window.UIIdioma.translatePage(document);
                }
            } catch { }

            // Ocultar pantalla de carga
            hidePreloader();
        });

        // ── CONTROL DE PANTALLA DE CARGA (DARK GLASSMORPHIC) ──
        function hidePreloader() {
            const preloader = document.getElementById("app-preloader");
            if (preloader && !preloader.classList.contains("is-hidden")) {
                preloader.classList.add("is-hidden");
                setTimeout(() => {
                    if (preloader.parentNode) preloader.parentNode.removeChild(preloader);
                }, 450);
            }
        }
        // Fallback de seguridad extendido si la conexión es extremadamente lenta
        setTimeout(hidePreloader, 8000);
    </script>
