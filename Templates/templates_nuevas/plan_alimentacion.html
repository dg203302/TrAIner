<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plan de Alimentación · TrAIner</title>

    <!-- Fuentes y Recursos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="/Icons/2.png">

    <!-- Scripts auxiliares -->
    <script src="/Scripts/ui_idioma.js"></script>
    <script src="/Scripts/spa_router.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/Scripts/ui_bottom_sheet.js?v=5"></script>

    <style>
        :root {
            --bg-black: #0c0d10;
            --bg-card: #181a1f;
            --bg-card-elevated: #20232a;
            --bg-card-subtle: #14161a;
            --text-primary: #ffffff;
            --text-secondary: #8a909a;
            --text-muted: #585d68;
            --dot-active: #ffffff;
            --dot-inactive: #282b33;
            --accent-glow: rgba(255, 255, 255, 0.08);
            --border-card: rgba(255, 255, 255, 0.06);
            --radius-card: 26px;
            --radius-inner: 18px;
            --radius-pill: 999px;
            --nav-height: 78px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: calc(var(--nav-height) + 24px + env(safe-area-inset-bottom, 20px));
        }

        /* Contenedor responsivo centrado */
        .app-container {
            width: 100%;
            max-width: 440px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ── HEADER FLOTANTE / STICKY ── */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: -16px -20px 0 -20px;
            padding: calc(14px + env(safe-area-inset-top, 6px)) 20px 14px 20px;
            background: rgba(12, 13, 16, 0.82);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            transition: all 0.25s ease;
        }

        .header-title-wrap {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.8px;
            color: #fff;
            line-height: 1.1;
        }

        .header-user-status {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .header-user-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #2ed573;
            box-shadow: 0 0 8px rgba(46, 213, 115, 0.6);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            position: relative;
        }

        .header-avatar-btn {
            border: 1.8px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
            padding: 0;
            background: #181a20;
        }

        .header-avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            background: #1e222a;
            transition: transform 0.2s ease;
        }

        .header-avatar-btn:hover .header-avatar-img {
            transform: scale(1.08);
        }

        .header-btn:active {
            transform: scale(0.92);
            background: var(--bg-card-elevated);
        }

        /* ── BARRA DE NAVEGACIÓN INFERIOR FLOTANTE ── */
        .bottom-nav {
            position: fixed;
            bottom: calc(16px + env(safe-area-inset-bottom, 12px));
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 36px);
            max-width: 380px;
            height: 64px;
            padding: 0 8px;
            background: rgba(22, 25, 31, 0.84);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-pill);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.03);
            z-index: 1000;
        }

        .bottom-nav-inner {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0;
        }

        .nav-item {
            background: transparent;
            border: none;
            color: #535866;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            position: relative;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            stroke-width: 2.1;
            stroke: currentColor;
            fill: none;
            transition: stroke 0.2s ease, transform 0.2s ease;
        }

        .nav-item:hover {
            color: #ffffff;
        }

        .nav-item:hover svg {
            stroke: #ffffff;
        }

        .nav-item:active {
            transform: scale(0.88);
        }

        .nav-item.is-active {
            color: #ffffff;
        }

        .nav-item.is-active svg {
            stroke: #ffffff;
        }

        /* ── CONTENIDO PRINCIPAL (espacio para elementos de esta plantilla) ── */
        .page-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- HEADER FLOTANTE -->
        <header class="app-header">
            <div class="header-title-wrap">
                <h1 class="header-title" data-i18n-en="Nutrition">Alimentación</h1>
                <div class="header-user-status" id="header-user-status">
                    <span class="header-user-dot"></span>
                    <span id="header-username-text">Sincronizando...</span>
                </div>
            </div>

            <div class="header-actions">
                <a href="/Templates/templates_nuevas/config.html" class="header-btn header-avatar-btn"
                    id="btn-header-settings" aria-label="Perfil de Usuario y Configuración" title="Perfil de Usuario">
                    <img id="header-user-avatar"
                        src="https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y"
                        alt="Foto de perfil" class="header-avatar-img">
                </a>
            </div>
        </header>

        <!-- ═══════════════════════════════════════════════ -->
        <!-- CONTENIDO PRINCIPAL: Plan de Alimentación       -->
        <!-- Aquí van los elementos propios de esta vista    -->
        <!-- ═══════════════════════════════════════════════ -->
        <main class="page-content" id="page-content">
            <!-- TODO: Agregar contenido del plan de alimentación -->
        </main>
    </div>

    <!-- ── BARRA INFERIOR DE NAVEGACIÓN ── -->
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <!-- 1. Grid / Dashboard -->
            <a href="/Templates/templates_nuevas/dashboard.html" class="nav-item"
                aria-label="Panel de Entrenamientos">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="7" height="7" rx="2"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="2"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="2"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="2"></rect>
                </svg>
            </a>

            <!-- 2. Calendario -->
            <a href="/Templates/templates_nuevas/calendario_renov.html" class="nav-item"
                aria-label="Calendario de Entreno">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
            </a>

            <!-- 3. Planes -->
            <a href="/Templates/templates_nuevas/plan_entreno.html" class="nav-item"
                aria-label="Plan de Entrenamiento">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="m6.5 6.5 11 11"></path>
                    <path d="m21 21-1-1"></path>

            <!-- 4. Alimentación (Activo en esta página) -->
            <a href="/Templates/templates_nuevas/plan_alimentacion.html" class="nav-item is-active"
                aria-label="Plan de Alimentación">
                <svg viewBox="0 0 24 24">
                    <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path>
                    <path d="M7 2v20"></path>
                    <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path>
                </svg>
            </a>

            <!-- 5. Chat Asistente IA -->
            <a href="/Templates/templates_nuevas/chatbot.html" class="nav-item" id="btn-nav-chat"
                aria-label="Asistente Inteligente TrAIner">
                <svg viewBox="0 0 24 24">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
            </a>
        </div>
    </nav>
</body>

</html>
